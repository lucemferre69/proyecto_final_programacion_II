{% extends 'menu.html' %}

{% block message %}
    <form class="message" action="{{ url_for('eliminar', id=pokemon['id']) }}" method="POST">
        <div>
            <label>¿Eliminar a {{pokemon['nombre']}}?</label>
            <img src="{{pokemon['foto']}}">
            <a class="cancelar" type="button" href="/menu/selected={{pokemon['id']}}">No</a>
            <button type="submit" class="enviar">Si</button>
        </div>
    </form>
{% endblock %}
