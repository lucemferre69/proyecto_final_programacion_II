<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Proyecto Final</title>
    <link rel="icon" href="../static/img/pokeball-icon.png" type="image/png">
    <link rel="stylesheet" href="../static/css/index.css">
    <script src="../static/js/index.js" defer></script>
</head>
<body>
    <div class="costado">
    </div>
    <div class="top-contenedor">
        <div class="borde-2">
            <div class="borde">
                <span class="c1"><img src="../static/img/boton-de-encendido.png"></span>
                <span class="c2"></span>
                <span class="c3"></span>
                <span class="c4"></span>
            </div>
        </div>
        <div class="search">
            <input type="text" placeholder="Buscar (Nombre, ID)" class="buscar-texto">
            <div class="search-button">
                <p>▼</p>
            </div>
            <div class="search-contenedor hidden">
                <button class="tipo_1 normal">NORMAL</button>
                <button class="tipo_1 fuego">FUEGO</button>
                <button class="tipo_1 agua">AGUA</button>
                <button class="tipo_1 electrico">ELECTRICO</button>
                <button class="tipo_1 planta">PLANTA</button>
                <button class="tipo_1 hielo">HIELO</button>
                <button class="tipo_1 lucha">LUCHA</button>
                <button class="tipo_1 veneno">VENENO</button>
                <button class="tipo_1 tierra">TIERRA</button>
                <button class="tipo_1 volador">VOLADOR</button>
                <button class="tipo_1 psiquico">PSIQUICO</button>
                <button class="tipo_1 bicho">BICHO</button>
                <button class="tipo_1 roca">ROCA</button>
                <button class="tipo_1 fantasma">FANTASMA</button>
                <button class="tipo_1 dragon">DRAGON</button>
                <button class="tipo_1 siniestro">SINIESTRO</button>
                <button class="tipo_1 acero">ACERO</button>
                <button class="tipo_1 hada">HADA</button>
                </div>
            <button class="limpiar-filtros">X</button>
        </div>
    </div>
    <div class="muestra">
        <div class="pantalla"></div>
        {% block content %}{% endblock %}
    </div>
    <a class="agregar" href="{{url_for('agregar')}}">Agregar Pokémon</a>
    <div class="herramientas">
        <div class="pantalla"></div>
        {% block tools %}{% endblock %}
    </div>
    <div class="botones-agrupar">
        <button data-num="1">x1</button>
        <button data-num="2">x2</button>
        <button data-num="3">x3</button>
        <button data-num="4">x4</button>
    </div>
    {% block message %}
    {% endblock %}
</body>
</html>
