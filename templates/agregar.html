{% extends 'menu.html' %}

{% block tools %}
    <form action="{{ url_for('agregar') }}" method="POST">
        <div class="pokemon-selected">
            <div class="capsule">
                <span></span>
                <input name="id" class="id_poke" type="number" min="1" placeholder="ID Unica" required>
            </div>
            <div class="foto">
                <input class="input-foto" type="text" name="url_foto" placeholder="URL del sprite" required>
                <img class="foto-agregar">
            </div>
            <div class="capsule">
                <span></span>
                <input type="text" class="nombre" name="nombre" placeholder="Nombre del Pokémon">
            </div>
            <div class="tipos cont-select">
                <select class="tipo_1 normal" name="tipo_1">
                    <option value="normal">NORMAL</option>
                    <option value="fuego">FUEGO</option>
                    <option value="agua">AGUA</option>
                    <option value="electrico">ELECTRICO</option>
                    <option value="planta">PLANTA</option>
                    <option value="hielo">HIELO</option>
                    <option value="lucha">LUCHA</option>
                    <option value="veneno">VENENO</option>
                    <option value="tierra">TIERRA</option>
                    <option value="volador">VOLADOR</option>
                    <option value="psiquico">PSIQUICO</option>
                    <option value="bicho">BICHO</option>
                    <option value="roca">ROCA</option>
                    <option value="fantasma">FANTASMA</option>
                    <option value="dragon">DRAGON</option>
                    <option value="siniestro">SINIESTRO</option>
                    <option value="acero">ACERO</option>
                    <option value="hada">HADA</option>
                </select>
                <select class="tipo_2 normal hidden">
                    <option value="normal">NORMAL</option>
                    <option value="fuego">FUEGO</option>
                    <option value="agua">AGUA</option>
                    <option value="electrico">ELECTRICO</option>
                    <option value="planta">PLANTA</option>
                    <option value="hielo">HIELO</option>
                    <option value="lucha">LUCHA</option>
                    <option value="veneno">VENENO</option>
                    <option value="tierra">TIERRA</option>
                    <option value="volador">VOLADOR</option>
                    <option value="psiquico">PSIQUICO</option>
                    <option value="bicho">BICHO</option>
                    <option value="roca">ROCA</option>
                    <option value="fantasma">FANTASMA</option>
                    <option value="dragon">DRAGON</option>
                    <option value="siniestro">SINIESTRO</option>
                    <option value="acero">ACERO</option>
                    <option value="hada">HADA</option>
                </select>
            <input type="hidden" name="tipo_2" class="input-hidden">
            <button type="button"  class="btn-tipo-2 mas">+</button>
            </div>
            </div>
        <div class="botones-crud">
            <button type="submit" class="enviar">Guardar</button>
        </div>
        {% if error != "" %}
                <p class="error">Error: {{error}}</p>
                {% endif %}
    </form>
{% endblock %}
